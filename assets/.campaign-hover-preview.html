    </pattern></defs><rect width="1000" height="700" fill="#f7f9fc" /><rect width="1000" height="700" fill="url(#campaign-grid)" /><g class="campaign-map-feature   " data-campaign-feature="campaign-0-Magny" data-campaign-commune="Magny" data-campaign-count="1" role="button" tabindex="0" aria-label="Magny, 1 inscrit"><title>Magny</title><path d="M50.00 564.29 L478.57 564.29 L478.57 135.71 L50.00 135.71 L50.00 564.29 Z" fill="rgb(20,83,163)" fill-rule="evenodd" /><text x="221.43" y="392.86">Magny</text></g><g class="campaign-map-feature   " data-campaign-feature="campaign-1-Vesoul" data-campaign-commune="Vesoul" data-campaign-count="1" role="button" tabindex="0" aria-label="Vesoul, 1 inscrit"><title>Vesoul</title><path d="M521.43 564.29 L950.00 564.29 L950.00 135.71 L521.43 135.71 L521.43 564.29 Z" fill="rgb(20,83,163)" fill-rule="evenodd" /><text x="692.86" y="392.86">Vesoul</text></g></svg><div id="campaign-map-tooltip" class="campaign-map-tooltip" role="tooltip" hidden></div></main><script>const campaignGradientEnabled=true;function updateCampaignMapTooltip(event) {
  const tooltip = document.querySelector("#campaign-map-tooltip");
  if (!tooltip) return;
  const feature = event.target.closest?.(".campaign-map-feature[data-campaign-commune]");
  if (!campaignGradientEnabled || event.pointerType === "touch" || !feature?.dataset.campaignCommune) { tooltip.hidden = true; return; }
  const count = Number(feature.dataset.campaignCount || 0);
  tooltip.textContent = `${feature.dataset.campaignCommune} · ${count} inscrit${count > 1 ? "s" : ""}`;
  tooltip.hidden = false;
  const panel = tooltip.closest(".campaign-map-panel");
  const bounds = panel.getBoundingClientRect();
  tooltip.style.left = `${Math.max(8, Math.min(bounds.width - tooltip.offsetWidth - 8, event.clientX - bounds.left + 14))}px`;
  const above = event.clientY - bounds.top - tooltip.offsetHeight - 12;
  tooltip.style.top = `${above >= 8 ? above : event.clientY - bounds.top + 16}px`;
}

document.addEventListener('pointermove',updateCampaignMapTooltip)</script></body></html>
